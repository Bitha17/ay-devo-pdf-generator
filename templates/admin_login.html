{% extends "base.html" %}
{% block title %}Admin login{% endblock %}
{% block content %}
<div class="formcard">
  <h2 style="margin-top:0">Admin login</h2>
  <form method="post">
    <label>Password</label>
    <input type="password" name="password" id="pw" autofocus required>
    <label class="pwshow"><input type="checkbox" id="pwShow"> Show password</label>
    <div class="actions"><button class="btn primary" type="submit">Log in</button></div>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.getElementById("pwShow").addEventListener("change", function () {
    document.getElementById("pw").type = this.checked ? "text" : "password";
  });
</script>
{% endblock %}
