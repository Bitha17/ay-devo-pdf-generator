<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#204170">
<title>{% block title %}AbbaYouth Devotion{% endblock %}</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='favicon.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script>
  // Apply saved/system theme before paint to avoid a flash.
  (function () {
    var saved = localStorage.getItem("devo-theme");
    var sys = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", saved || sys);
  })();
</script>
</head>
<body>
<div class="topbar">
  <a class="brand" href="{{ url_for('index') }}">AbbaYouth Devotion</a>
  <a class="iconbtn" href="{{ url_for('archive') }}">🗂 Archive</a>
  <button class="iconbtn" id="themeToggle" aria-label="Toggle theme">🌙</button>
</div>

<div class="wrap">
  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
  <div class="foot">AbbaYouth Devotion · app by TP</div>
</div>

<script>
  var toggle = document.getElementById("themeToggle");
  function syncIcon() {
    var dark = document.documentElement.getAttribute("data-theme") === "dark";
    toggle.textContent = dark ? "☀️" : "🌙";
  }
  syncIcon();
  toggle.addEventListener("click", function () {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("devo-theme", next);
    syncIcon();
  });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
